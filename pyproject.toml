[project]
name = "context-engine"
version = "0.1.0"
description = "Lightweight context engine MCP for the data agent: hybrid retrieval over MDL, glossary and golden SQL"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mcp[cli]>=1.19.0,<2",
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
    "pyyaml>=6.0.2",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
vector = [
    "fastembed>=0.7.0",   # ONNX 本地嵌入，支持 BAAI/bge-small-zh-v1.5，无需 torch
    "lancedb>=0.15.0",    # 嵌入式向量库，无独立服务
]
memory = [
    "mem0ai>=2.0.6",      # Mem0 SDK v2：内置图记忆 + 混合检索
    "chromadb>=0.6.0",    # 嵌入式向量存储，无独立服务
    "ollama>=0.4.0",      # 本地 LLM/嵌入客户端（phi4 + bge-m3）
]

[tool.uv]
package = false
