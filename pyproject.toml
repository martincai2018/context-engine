[project]
name = "context-engine"
version = "0.1.0"
description = "Lightweight context engine MCP for the data agent: hybrid retrieval over MDL, glossary and golden SQL"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mcp[cli]>=1.19.0,<2",
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
    "pyyaml>=6.0.2",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
vector = [
    "fastembed>=0.7.0",   # ONNX 本地嵌入，支持 BAAI/bge-small-zh-v1.5，无需 torch
    "lancedb>=0.15.0",    # 嵌入式向量库，无独立服务
]

[tool.uv]
package = false
